name: Compilar APK Punto Técnica

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar proyecto
        run: |
          mkdir -p proyecto
          unzip -o Listado_GitHub_PuntoTecnica.zip -d proyecto

          echo "Buscando proyecto Android..."
          find proyecto -name settings.gradle -o -name settings.gradle.kts

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          PROJECT_DIR=$(dirname "$(find proyecto -name settings.gradle -o -name settings.gradle.kts | head -1)")
          echo "Proyecto encontrado en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Buscar APK
        run: |
          find proyecto -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Punto-Tecnica-APK
          path: proyecto/**/build/outputs/apk/**/*.apk
